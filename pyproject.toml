[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-design-agent"
version = "0.1.0"
description = "Conditional optical design with a PyTorch CVAE and sequential ray tracing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Amer Saidi"}]
dependencies = ["numpy>=1.26,<3", "torch>=2.2,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
optical-agent = "optical_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
